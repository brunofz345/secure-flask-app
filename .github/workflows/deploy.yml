name: 🚀 Deploy para Produção

# ── Gatilho: dispara a cada push na branch main ──
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite disparo manual pela UI do GitHub

# ── Permissões mínimas (princípio do menor privilégio) ──
permissions:
  contents: read

# ── Evita deploys concorrentes simultâneos ──
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ══════════════════════════════════════════════
  # JOB 1 — Testes e auditoria de segurança
  # ══════════════════════════════════════════════
  test:
    name: 🧪 Testes e Auditoria
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Auditoria de vulnerabilidades nas dependências (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --strict || echo "⚠️ Vulnerabilidades encontradas"

      - name: 🛡️ Análise estática de segurança (bandit)
        run: |
          pip install bandit
          bandit -r . -x ./venv,./.venv -ll || echo "⚠️ Issues encontradas"

      - name: ✅ Verificar importação do app (smoke test)
        run: |
          python -c "import app; print('✅ App importa sem erros')"
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY_TEST }}

  # ══════════════════════════════════════════════
  # JOB 2 — Deploy via SSH no servidor de produção
  # ══════════════════════════════════════════════
  deploy:
    name: 🌐 Deploy em Produção
    needs: test                    # só roda se os testes passarem
    runs-on: ubuntu-latest
    environment: production        # requer aprovação se configurado

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔑 Configurar chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🌍 Adicionar host à known_hosts (evita MITM)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: 🚚 Enviar código para o servidor via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='venv/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='.env' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/secure-flask-app/

      - name: 🔄 Reiniciar aplicação no servidor
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              'bash -s' << 'EOF'
            set -e
            cd /var/www/secure-flask-app

            # Cria/atualiza ambiente virtual
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Reinicia serviço systemd
            sudo systemctl restart secure-flask-app
            sudo systemctl status secure-flask-app
          EOF

      - name: ✅ Health check pós-deploy
        run: |
          sleep 5
          curl -f -s -o /dev/null -w "%{http_code}" \
            https://${{ secrets.SSH_HOST }}/login | grep -q "200" \
            && echo "✅ Aplicação respondendo" \
            || (echo "❌ Falha no health check" && exit 1)

      - name: 📢 Notificar sucesso
        if: success()
        run: echo "🎉 Deploy concluído com sucesso para produção"
